# 生产部署：docker compose up -d --build
# 完整步骤见 README「部署（Docker）」：先准备 backend/.env、根目录 .env（YCG_DOMAIN），并把 ./data ./secrets 授权给 uid 10001
services:
  app:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    environment:
      YCG_ENV: prod
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
    expose:
      - "8000"
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      YCG_DOMAIN: ${YCG_DOMAIN:-example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data: {}
